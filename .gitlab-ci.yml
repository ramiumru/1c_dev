stages:
  - validate

validate:windows:
  stage: validate
  tags:
    - windows
  script:
    - python -m compileall -q core/scripts core/skills
    - python core/scripts/doctor.py
    - python core/scripts/validate.py

validate:linux:
  stage: validate
  image: python:3-slim
  script:
    - python -m compileall -q core/scripts core/skills
    - python core/scripts/validate.py --skip-smoke

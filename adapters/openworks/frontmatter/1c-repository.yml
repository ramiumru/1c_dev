description: "Хранилище конфигурации 1С: чтение статуса/истории/diff, захват, помещение с комментарием и отмена своих захватов через safe_repository.py. Только основная конфигурация, базы из .v8-project.json; без apply, force, bind/unbind, получения версии и изменения исходников."
mode: all
permission:
  "*": deny
  read:
    "*": deny
    "INSTRUCTIONS.md": allow
    "AGENTS.md": allow
    ".v8-project.json": allow
    ".opencode/agents/1c-repository.md": allow
    ".opencode/context/rules/repository-workflow.md": allow
    ".opencode/context/projects/**": allow
    "projects/**": allow
    "specs/**": allow
    "pilot-control/**": allow
    "scripts/**": allow
    ".opencode/skills/1c-repository-manage/**": allow
  glob:
    "*": deny
    "INSTRUCTIONS.md": allow
    "AGENTS.md": allow
    ".v8-project.json": allow
    ".opencode/agents/1c-repository.md": allow
    ".opencode/context/rules/repository-workflow.md": allow
    ".opencode/context/projects/**": allow
    "projects/**": allow
    "specs/**": allow
    "pilot-control/**": allow
    "scripts/**": allow
    ".opencode/skills/1c-repository-manage/**": allow
  grep:
    "*": deny
    "INSTRUCTIONS.md": allow
    "AGENTS.md": allow
    ".v8-project.json": allow
    ".opencode/agents/1c-repository.md": allow
    ".opencode/context/rules/repository-workflow.md": allow
    ".opencode/context/projects/**": allow
    "projects/**": allow
    "specs/**": allow
    "pilot-control/**": allow
    "scripts/**": allow
    ".opencode/skills/1c-repository-manage/**": allow
  list:
    "*": deny
    "INSTRUCTIONS.md": allow
    "AGENTS.md": allow
    ".v8-project.json": allow
    ".opencode/agents/1c-repository.md": allow
    ".opencode/context/rules/repository-workflow.md": allow
    ".opencode/context/projects/**": allow
    "projects/**": allow
    "specs/**": allow
    "pilot-control/**": allow
    "scripts/**": allow
    ".opencode/skills/1c-repository-manage/**": allow
  edit:
    "*": deny
  bash:
    "*": deny
    "python scripts/repository_setup.py *": allow
    "py -3 scripts/repository_setup.py *": allow
    "python scripts/safe_repository.py *": allow
    "py -3 scripts/safe_repository.py *": allow
  task: deny
  external_directory: deny
  skill:
    "*": deny
    "1c-repository-manage": allow

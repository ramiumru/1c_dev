description: "Апликер конфигурации 1С — применение готовых правок из projects/** (от 1c-developer) в живую информационную базу. Использовать только по явному запросу пользователя (через делегирование от 1c-do). НЕ правит исходники (→ 1c-developer), НЕ анализирует (→ 1c-analyst). Работает с базами из .v8-project.json. В SDD-режиме читает 06_change_report.md для списка изменённых файлов."
mode: all
model: level/z-ai/glm-5.2
permission:
  read:
    "INSTRUCTIONS.md": allow
    "AGENTS.md": allow
    ".kilo/agent/1c-applier.md": allow
    ".v8-project.json": allow
    ".kilo/context/projects/**": allow
    "projects/**": allow
    "specs/**": allow
    ".kilo/logs/1c-applier/**": allow
  glob:
    "INSTRUCTIONS.md": allow
    "AGENTS.md": allow
    ".kilo/agent/1c-applier.md": allow
    ".v8-project.json": allow
    ".kilo/context/projects/**": allow
    "projects/**": allow
    "specs/**": allow
    ".kilo/logs/1c-applier/**": allow
  grep:
    "INSTRUCTIONS.md": allow
    "AGENTS.md": allow
    ".kilo/agent/1c-applier.md": allow
    ".kilo/context/projects/**": allow
    "projects/**": allow
    "specs/**": allow
  list:
    "INSTRUCTIONS.md": allow
    "AGENTS.md": allow
    ".kilo/agent/1c-applier.md": allow
    ".v8-project.json": allow
    ".kilo/context/projects/**": allow
    "projects/**": allow
    "specs/**": allow
    ".kilo/logs/1c-applier/**": allow
  edit:
    ".v8-project.json": allow
    ".kilo/logs/1c-applier/**": allow
  bash:
    "powershell.exe -NoProfile -File .kilo/skills/db-*": allow
    "powershell.exe -NoProfile -File .kilo/skills/web-*": allow
  task: deny
  webfetch: deny
  websearch: deny
  lsp: deny
  semantic_search: deny
  external_directory: deny
  skill:
    "db-list": allow
    "db-create": allow
    "db-dump-xml": allow
    "db-dump-dt": allow
    "db-dump-cf": allow
    "db-load-xml": allow
    "db-load-git": allow
    "db-load-cf": allow
    "db-load-dt": allow
    "db-update": allow
    "db-run": allow
    "web-info": allow
    "web-publish": allow
    "web-stop": allow
    "web-test": allow
    "web-unpublish": allow
  mcp:
    "*": deny

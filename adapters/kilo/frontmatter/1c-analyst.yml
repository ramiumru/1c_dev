description: Аналитик 1С (полный доступ) — анализ бизнес-логики и структуры объектов всей конфигурации (общие модули, регистры, подписки на события, отчёты, роли). Проект 1С определяется per-запросом (передаётся в Task-брифе от 1c-do). Не пишет код. Discovery через project MCP sources (metadata/code/platform_help/standards) с fallback на локальные исходники projects/<источник>/src/**. Использует info-скиллы (meta-info, form-info, mxl-info, skd-info, xdto-info, role-info, subsystem-info, cf-info, cfe-diff) для анализа структуры объектов вместо ручного разбора XML. В SDD-режиме (при делегировании через 1c-do с task-папкой specs/<TASK-ID>/) заполняет артефакты 01_context.md, 03_solution_spec.md, 05_test_scenarios.md по шаблонам specs/README.md.
mode: all
model: level/z-ai/glm-5.2
permission:
  read:
    "INSTRUCTIONS.md": allow
    ".kilo/agent/1c-analyst.md": allow
    ".kilo/context/projects/**": allow
    ".kilo/context/common/**": allow
    ".kilo/context/standards/**": allow
    "specs/**": allow
    "projects/**/src/**": allow
    ".kilo/logs/**": allow
  glob:
    "INSTRUCTIONS.md": allow
    ".kilo/agent/1c-analyst.md": allow
    ".kilo/context/projects/**": allow
    ".kilo/context/common/**": allow
    ".kilo/context/standards/**": allow
    "specs/**": allow
    "projects/**/src/**": allow
    ".kilo/logs/**": allow
  grep:
    "INSTRUCTIONS.md": allow
    ".kilo/agent/1c-analyst.md": allow
    ".kilo/context/projects/**": allow
    ".kilo/context/common/**": allow
    ".kilo/context/standards/**": allow
    "specs/**": allow
    "projects/**/src/**": allow
    ".kilo/logs/**": allow
  list:
    "INSTRUCTIONS.md": allow
    ".kilo/agent/1c-analyst.md": allow
    ".kilo/context/projects/**": allow
    ".kilo/context/common/**": allow
    ".kilo/context/standards/**": allow
    "specs/**": allow
    "projects/**/src/**": allow
    ".kilo/logs/**": allow
  edit:
    "*": deny
    ".kilo/context/projects/**": allow
    ".kilo/context/common/**": allow
    "specs/**": allow
    ".kilo/logs/1c-analyst/**": allow
  bash:
    "python scripts/scope_hash.py --spec *": allow
    "powershell.exe -NoProfile -File .kilo/skills/meta-info/scripts/meta-info.ps1 *": allow
    "powershell.exe -NoProfile -File .kilo/skills/form-info/scripts/form-info.ps1 *": allow
    "powershell.exe -NoProfile -File .kilo/skills/mxl-info/scripts/mxl-info.ps1 *": allow
    "powershell.exe -NoProfile -File .kilo/skills/skd-info/scripts/skd-info.ps1 *": allow
    "powershell.exe -NoProfile -File .kilo/skills/xdto-info/scripts/xdto-info.ps1 *": allow
    "powershell.exe -NoProfile -File .kilo/skills/role-info/scripts/role-info.ps1 *": allow
    "powershell.exe -NoProfile -File .kilo/skills/subsystem-info/scripts/subsystem-info.ps1 *": allow
    "powershell.exe -NoProfile -File .kilo/skills/cf-info/scripts/cf-info.ps1 *": allow
    "powershell.exe -NoProfile -File .kilo/skills/cfe-diff/scripts/cfe-diff.ps1 *": allow
  task: deny
  webfetch: deny
  websearch: deny
  lsp: deny
  semantic_search: deny
  external_directory: deny
  skill:
    "meta-info": allow
    "form-info": allow
    "mxl-info": allow
    "skd-info": allow
    "xdto-info": allow
    "role-info": allow
    "subsystem-info": allow
    "cf-info": allow
    "cfe-diff": allow
  mcp:
    "*": deny
    "metadata_*": allow
    "code_*": allow
    "platform_help_*": allow
    "v8std_*": allow
    "standards_*": allow
